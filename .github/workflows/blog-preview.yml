name: Blog build, QA and Pages

"on":
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Extract verified Hugo release
        run: python3 -B _blog/support/hugo.py "$RUNNER_TEMP/blog-tools/hugo"
      - name: Build the combined public site
        run: python3 -B _blog/support/build.py --hugo "$RUNNER_TEMP/blog-tools/hugo" --output "$RUNNER_TEMP/site-preview"
      - name: Check original routes, post rendering and collisions
        run: python3 -B _blog/support/qa.py --hugo "$RUNNER_TEMP/blog-tools/hugo" --site "$RUNNER_TEMP/site-preview"
      - name: Upload preview artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: ${{ runner.temp }}/site-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Package reviewed Pages artifact
        if: github.repository == 'yaohway/yaohway.github.io' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site-preview/
          name: github-pages

  deploy:
    if: github.repository == 'yaohway/yaohway.github.io' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: academic-site-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require owner-configured Actions publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api repos/yaohway/yaohway.github.io/pages --jq .build_type)
          if [ "$mode" != workflow ]; then
            echo 'Pages source is not GitHub Actions. Owner cutover required; no settings were changed.' >&2
            exit 1
          fi
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages
